name: Bug or Lua error
description: Something doesn't work, or the game shows a Lua error from OpenMap
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Turn errors on with `/console scriptErrors 1`, then paste the whole message, stack and all.
      render: text
  - type: input
    id: version
    attributes:
      label: OpenMap version
      description: Shown in the addon list, or by `/openmap status`.
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other addons
      description: Especially map addons (Leatrix Maps, Mapster, Magnify ...), Questie and TomTom.
