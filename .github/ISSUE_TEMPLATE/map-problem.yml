name: Map problem
description: Something on the map looks wrong (a seam, a gap, a wrong colour, a missing place ...)
labels: ["map", "from-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! In game: open the map, click the **Report a problem** button (top-left of the map),
        circle the problem and copy the code it gives you.
  - type: input
    id: code
    attributes:
      label: Report code
      description: The code from the Report a problem button (starts with OM1|).
      placeholder: OM1|0.1.0|1429|0.72817|0.64960|22.50|0.72801:0.64911:0.00120|the river ends in a hard line
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What's wrong?
      description: Anything the code's note didn't cover. A screenshot helps a lot (drag it in here).
  - type: input
    id: addons
    attributes:
      label: Other map addons you use (if any)
