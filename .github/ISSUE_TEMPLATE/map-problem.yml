name: Problem report (from the game)
description: Something's wrong with OpenMap, on the map (a seam, a gap, a wrong colour ...) or anywhere else (the menu, a setting, another addon)
labels: ["from-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! In game: open the map, open the **OpenMap** menu (the button in the map's
        bottom-left corner) and click **Report a problem**. If it's about a spot on the map, circle it;
        if it's about something else (the menu, a setting ...), just click Next. Then copy the code it gives you.
  - type: input
    id: code
    attributes:
      label: Report code
      description: The code from the Report a problem button (starts with OM1|).
      placeholder: OM1|0.1.0|1429|0.72817|0.64960|22.50|0.72801:0.64911:0.00120|the river ends in a hard line
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What's wrong?
      description: Anything the code's note didn't cover. A screenshot helps a lot (drag it in here).
  - type: input
    id: addons
    attributes:
      label: Other map addons you use (if any)
