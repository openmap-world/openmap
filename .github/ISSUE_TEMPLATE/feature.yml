name: Idea or request
description: Something OpenMap could do
labels: ["enhancement"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game version
      description: Which game is this about? ("This website" means openmap.world.)
      options:
        - Forever
        - Classic
        - Retail
        - This website
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you'd want to do with the map, and why. Screenshots or mock-ups welcome.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        OpenMap only shows what's in the game's own files (Blizzard's art, the game's data): ideas that need new art or made-up content won't fit.
