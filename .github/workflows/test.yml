name: test
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python tools/offline-test/run.py plain
      - run: python tools/offline-test/run.py secret
      - run: python tools/offline-test/lint.py
