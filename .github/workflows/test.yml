name: test
on:
  push:
  pull_request:
permissions:
  contents: read                  # tests only read the code
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [forever, retail]   # each client's toc (tools/clients.py)
    env:
      OPENMAP_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python -P tools/offline-test/lint.py
      - run: python tools/offline-test/run.py plain
      - run: python tools/offline-test/run.py combat
      - run: python tools/offline-test/run.py secret
      - run: python tools/offline-test/run.py pad
      - run: python tools/offline-test/run.py padmap
      - run: python tools/offline-test/run.py padview
      - run: python tools/offline-test/navigation.py
      - run: python -P tools/offline-test/player.py
      - run: python -P tools/offline-test/press.py
      - run: python -P tools/offline-test/brightness.py
      - run: python -P tools/offline-test/friends.py
      - run: python -P tools/offline-test/bosses.py
      - run: python -P tools/offline-test/questie.py
      - run: python -P tools/offline-test/layer.py
      - run: python -P tools/offline-test/padlayer.py
      # (WoW Forever's own data: its combat list, caves, painted gaps and sea chart)
      - if: matrix.client == 'forever'
        run: |
          python -P tools/offline-test/combat.py
          python -P tools/offline-test/caves.py
          python -P tools/offline-test/explored.py
          python -P tools/offline-test/chart.py
      - name: The tools at least compile
        run: python -m compileall -q tools
